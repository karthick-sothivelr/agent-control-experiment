<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Billing Agent</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f9fa;color:#111827}
  .header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 32px;display:flex;align-items:center;gap:12px}
  .header h1{font-size:17px;font-weight:600}
  .badge{background:#ede9fe;color:#5b21b6;font-size:11px;padding:3px 10px;border-radius:999px;font-weight:600;margin-left:4px}
  .container{max-width:960px;margin:36px auto;padding:0 24px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px}
  .card h2{font-size:15px;font-weight:600;margin-bottom:3px}
  .card .sub{color:#6b7280;font-size:13px;margin-bottom:18px}
  label{display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:5px;margin-top:14px}
  input[type=text],input[type=number]{width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;transition:border .15s,box-shadow .15s}
  input:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.1)}
  .btn{width:100%;margin-top:18px;padding:11px;background:#7c3aed;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
  .btn:hover{background:#6d28d9}
  .btn:disabled{background:#c4b5fd;cursor:not-allowed}
  .quick{display:flex;gap:8px;margin-top:10px}
  .quick button{flex:1;padding:9px 4px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid;transition:opacity .15s}
  .quick button:hover{opacity:.85}
  .q-green{border-color:#86efac;color:#166534;background:#f0fdf4}
  .q-red{border-color:#fca5a5;color:#991b1b;background:#fff1f2}
  .placeholder{text-align:center;padding:48px 20px;color:#9ca3af;font-size:14px}
  .placeholder span{font-size:32px;display:block;margin-bottom:10px}
  .result-box{border-radius:10px;padding:20px}
  .allowed{background:#f0fdf4;border:1.5px solid #86efac}
  .blocked{background:#fff1f2;border:1.5px solid #fca5a5}
  .status{font-size:18px;font-weight:700;margin-bottom:8px}
  .allowed .status{color:#15803d}
  .blocked .status{color:#b91c1c}
  .detail{font-size:13px;color:#374151;line-height:1.6;margin-top:8px}
  .ctrl-tag{display:inline-block;background:#fee2e2;color:#991b1b;font-size:11px;padding:2px 8px;border-radius:4px;font-family:monospace;margin-top:10px}
  .escalate{margin-top:12px;padding:10px 14px;background:#fefce8;border:1px solid #fde047;border-radius:8px;font-size:13px;color:#713f12;font-weight:500}
  .log{margin-top:10px;padding:8px 12px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;font-size:11px;font-family:monospace;color:#6b7280}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top-color:#7c3aed;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-box{text-align:center;padding:40px;color:#6b7280;font-size:14px}
</style>
</head>
<body>

<div class="header">
  <span style="font-size:22px">💳</span>
  <h1>Billing Agent</h1>
  <span class="badge">🛡 Protected by Agent Control</span>
</div>

<div class="container">
  <div class="card">
    <h2>Assign Credits to User</h2>
    <p class="sub">Simulate the billing agent processing a credit assignment</p>

    <label>User ID</label>
    <input type="text" id="userId" value="user_42" />

    <label>Credits to assign</label>
    <input type="number" id="amount" value="" placeholder="Enter amount..." min="1" />

    <button class="btn" id="sendBtn" onclick="sendRequest()">Send to Billing Agent →</button>

    <div class="quick">
      <button class="quick q-green" onclick="quickTest(20)">✓ Test 20 credits (allowed)</button>
      <button class="quick q-red" onclick="quickTest(100)">✗ Test 100 credits (blocked)</button>
    </div>
  </div>

  <div class="card">
    <h2>Agent Response</h2>
    <p class="sub">Real-time guardrail evaluation via Agent Control</p>
    <div id="resultArea">
      <div class="placeholder"><span>🤖</span>Send a request to see the guardrail in action</div>
    </div>
  </div>
</div>

<script>
async function quickTest(amount) {
  document.getElementById('amount').value = amount;
  await sendRequest();
}

async function sendRequest() {
  const amount = parseInt(document.getElementById('amount').value);
  const userId = document.getElementById('userId').value;
  if (!amount || !userId) return;

  const output = `Approved: assigning ${amount} credits to ${userId}. Routing to billing system.`;
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;

  document.getElementById('resultArea').innerHTML =
    `<div class="loading-box"><span class="spinner"></span>Evaluating with Agent Control...</div>`;

  try {
    const res = await fetch('/api/v1/evaluation', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        agent_name: 'awesome_bot_3000',
        step: {type: 'llm', name: 'assign_credit',
               input: `assign ${amount} credits to ${userId}`, output},
        stage: 'post'
      })
    });
    const data = await res.json();
    const blocked = data.matches?.[0]?.control_name;
    const pct = (data.confidence * 100).toFixed(0);

    if (data.is_safe) {
      document.getElementById('resultArea').innerHTML = `
        <div class="result-box allowed">
          <div class="status">✅ Request Allowed</div>
          <div class="detail"><strong>Agent output:</strong><br>${output}</div>
          <div class="log">is_safe: true &nbsp;·&nbsp; confidence: ${pct}% &nbsp;·&nbsp; guardrails checked: ${(data.non_matches||[]).length}</div>
        </div>`;
    } else {
      document.getElementById('resultArea').innerHTML = `
        <div class="result-box blocked">
          <div class="status">🚫 Request Blocked</div>
          <div class="detail"><strong>Intercepted output:</strong><br><em>${output}</em></div>
          <div><span class="ctrl-tag">${blocked}</span></div>
          <div class="escalate">⚠️ Escalating to human agent for review</div>
          <div class="log">is_safe: false &nbsp;·&nbsp; confidence: ${pct}% &nbsp;·&nbsp; action: deny</div>
        </div>`;
    }
  } catch(e) {
    document.getElementById('resultArea').innerHTML =
      `<div class="placeholder"><span>⚠️</span>${e.message}</div>`;
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
